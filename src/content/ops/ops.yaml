# 原子操作：用户的一次原始动作，绑定唯一界面。
# keywords 指向概念词典（留空表示这一步不需要解释什么）。
# 标签不在这一层：自定义位标签绑在「行为」上，见 behaviors.yaml。
# image 一般留空，会自动找图。一级界面：shots/<界面id>/<操作id>.webp；
#       二级界面：shots/<父界面id>/<界面id>/<操作id>.webp。
#       都没有就退到界面级截图，顺序是 <界面id>.webp → <界面id>-1.webp（二级界面同理放父目录下）。
#       截图由 scripts/crop_shots.py 统一处理成 1504x900 的 webp。
#       同名多个格式时优先 webp，其次 jpg、png。
#       也可以在编辑器里显式指定。配了图之后 hotspot 就叠在图上当高亮。
# short 是示意图下方显示的中文简称（四五个字），必填。
# hotspot 是界面示意图上的高亮区域（百分比），用来标出「点哪儿」。

- id: click-new-product
  screen: product-management
  action: 点击录入库存按钮，以新增制品
  short: 增加制品
  keywords: [sku]
  image: shots/product-management-1.webp
  hotspot:
    x: 88.9
    y: 0.9
    w: 10.3
    h: 8.7

- id: click-new-single
  screen: new-product
  action: 点击单个制品录入
  short: 录入单个制品
  keywords: [sku]
  hotspot:
    x: 11.4
    y: 28.3
    w: 25.5
    h: 29.7
