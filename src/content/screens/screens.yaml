# 界面：原子操作的容器。一个原子操作只属于一个界面，一个行为也只在一个界面内发生。
# parent 留空 = 一级界面；否则指向一个一级界面（只支持两级）。路径由层级自动生成。

- id: checkout
  name: 结算台
  note: 扫码、认会员、优惠、收款，一条流水在这里走完。

- id: product-edit
  name: 商品编辑
  parent: product-list
  note: 新建与修改共用同一张表单，字段完全一致。

- id: product-list
  name: 商品列表
  note: 在架与已下架商品的统一入口，也是所有商品级操作的起点。

- id: sales-report
  name: 销售报表
  note: 按商品、分类、时段聚合的销售数据，支持钻取到单品。

- id: stock-take
  name: 库存盘点
  note: 盘点单的列表、明细与提交都在这一页完成。
